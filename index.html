<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Bobby Boxing V6</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#05070d;
    color:white;
    user-select:none;
}

/* ================= GAME ================= */

#game{
    position:relative;
    width:100vw;
    height:100vh;
    min-height:550px;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 10%,
            #3b4058 0%,
            #1c2034 38%,
            #090c16 75%,
            #020307 100%
        );
}

/* ================= LIGHTS ================= */

.light{
    position:absolute;
    top:-200px;
    width:220px;
    height:700px;
    background:white;
    opacity:.10;
    filter:blur(28px);
    pointer-events:none;
}

.light1{
    left:10%;
    transform:rotate(18deg);
}

.light2{
    left:50%;
    transform:translateX(-50%);
    opacity:.15;
}

.light3{
    right:10%;
    transform:rotate(-18deg);
}

/* ================= TITLE ================= */

#title{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    z-index:200;

    font-size:clamp(25px,4vw,50px);
    font-weight:900;
    letter-spacing:4px;
    white-space:nowrap;

    text-shadow:
        4px 4px #000,
        0 0 20px rgba(255,40,70,.5);
}

#title span{
    color:#ff304f;
}

/* ================= HUD ================= */

.hud{
    position:absolute;
    top:25px;
    width:30%;
    z-index:210;
}

#playerHud{
    left:3%;
}

#enemyHud{
    right:3%;
}

.name{
    font-weight:900;
    font-size:17px;
    margin-bottom:6px;
}

#enemyHud .name{
    text-align:right;
}

.barOuter{
    width:100%;
    height:18px;
    border:2px solid white;
    background:#08090d;
    overflow:hidden;
    margin-bottom:5px;
    border-radius:4px;
}

.health{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#0cb84d,#39f06b);
    transition:width .2s;
}

.stamina{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#0876d1,#2dbaff);
    transition:width .2s;
}

/* ================= TIMER ================= */

#roundInfo{
    position:absolute;
    top:60px;
    left:50%;
    transform:translateX(-50%);
    z-index:220;
    text-align:center;
    text-shadow:3px 3px #000;
}

#roundLabel{
    font-size:11px;
    font-weight:bold;
    letter-spacing:3px;
}

#timer{
    font-size:34px;
    font-weight:900;
}

#timer.danger{
    color:#ff304f;
}

/* ================= CROWD ================= */

#crowd{
    position:absolute;
    top:120px;
    width:100%;
    text-align:center;
    color:#4a4f69;
    font-size:28px;
    letter-spacing:8px;
    opacity:.55;
}

/* ================= RING ================= */

#ring{
    position:absolute;

    left:4%;
    right:4%;

    bottom:8%;

    height:62%;

    overflow:hidden;

    border:10px solid #07090e;

    background:
        linear-gradient(
            180deg,
            #dfe3e8,
            #bbc0c7
        );

    box-shadow:
        0 25px 70px rgba(0,0,0,.85);
}

#floor{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    height:28%;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(0,0,0,.07) 0px,
            rgba(0,0,0,.07) 2px,
            transparent 2px,
            transparent 80px
        ),
        linear-gradient(
            #d8dadd,
            #aeb3ba
        );

    z-index:4;
}

/* ================= ROPES ================= */

.rope{
    position:absolute;
    left:0;
    right:0;

    height:7px;

    background:
        linear-gradient(
            #ff5267,
            #c81635
        );

    box-shadow:0 3px 5px rgba(0,0,0,.5);

    z-index:12;
}

.rope1{
    top:20%;
}

.rope2{
    top:45%;
}

.rope3{
    top:70%;
}

/* ================= POSTS ================= */

.post{
    position:absolute;
    top:-10px;
    bottom:-10px;

    width:30px;

    background:
        linear-gradient(
            90deg,
            #020305,
            #30333b,
            #050609
        );

    z-index:20;
}

.postLeft{
    left:4%;
}

.postRight{
    right:4%;
}

/* ================= FIGHTERS ================= */

.fighter{
    position:absolute;

    width:175px;
    height:270px;

    bottom:15%;

    z-index:30;

    transform-origin:center bottom;

    transition:left .08s linear;
}

.character{
    width:100%;
    height:100%;
    object-fit:contain;

    filter:
        drop-shadow(
            0 12px 7px rgba(0,0,0,.4)
        );

    pointer-events:none;
}

#bobby{
    left:19%;
}

#venom{
    left:69%;
    transform:scaleX(-1);
}

/* ================= BOBBY ATTACK ================= */

#bobby.jab{
    animation:bobbyJab .22s ease;
}

#bobby.cross{
    animation:bobbyCross .28s ease;
}

#bobby.heavy{
    animation:bobbyHeavy .38s ease;
}

@keyframes bobbyJab{

    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(28px);
    }
}

@keyframes bobbyCross{

    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:
            translateX(40px)
            scale(1.03);
    }
}

@keyframes bobbyHeavy{

    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:
            translateX(48px)
            scale(1.08);
    }
}

/* ================= VENOM ATTACK ================= */

#venom.jab{
    animation:venomJab .22s ease;
}

#venom.cross{
    animation:venomCross .28s ease;
}

#venom.heavy{
    animation:venomHeavy .38s ease;
}

@keyframes venomJab{

    0%,100%{
        transform:scaleX(-1);
    }

    50%{
        transform:
            scaleX(-1)
            translateX(28px);
    }
}

@keyframes venomCross{

    0%,100%{
        transform:scaleX(-1);
    }

    50%{
        transform:
            scaleX(-1)
            translateX(40px)
            scale(1.03);
    }
}

@keyframes venomHeavy{

    0%,100%{
        transform:scaleX(-1);
    }

    50%{
        transform:
            scaleX(-1)
            translateX(48px)
            scale(1.08);
    }
}

/* ================= HIT ================= */

#bobby.hit{
    animation:bobbyHit .25s ease;
}

#venom.hit{
    animation:venomHit .25s ease;
}

@keyframes bobbyHit{

    0%,100%{
        transform:translateX(0);
    }

    30%{
        transform:
            translateX(-22px)
            rotate(-5deg);
    }

    60%{
        transform:
            translateX(10px)
            rotate(3deg);
    }
}

@keyframes venomHit{

    0%,100%{
        transform:scaleX(-1);
    }

    30%{
        transform:
            scaleX(-1)
            translateX(-22px)
            rotate(-5deg);
    }

    60%{
        transform:
            scaleX(-1)
            translateX(10px);
    }
}

/* ================= JUMP ================= */

#bobby.jump{
    animation:bobbyJump .5s ease;
}

@keyframes bobbyJump{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-100px);
    }
}

/* ================= BLOCK ================= */

#bobby.block{
    transform:
        translateX(-8px)
        scale(.96);
}

/* ================= EFFECT ================= */

#effects{
    position:absolute;
    inset:0;
    z-index:300;
    pointer-events:none;
}

.spark{
    position:absolute;
    transform:translate(-50%,-50%);
    font-size:65px;

    animation:spark .4s ease forwards;
}

@keyframes spark{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    35%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.3);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(1.8);
    }
}

/* ================= MESSAGE ================= */

#message{
    position:absolute;

    top:32%;
    left:50%;

    transform:translateX(-50%);

    z-index:400;

    opacity:0;

    font-size:clamp(35px,6vw,70px);

    font-weight:900;

    text-shadow:
        5px 5px #000;

    white-space:nowrap;
}

.messageShow{
    animation:messageAnimation .7s ease;
}

@keyframes messageAnimation{

    0%{
        opacity:0;
        transform:
            translateX(-50%)
            scale(.3);
    }

    30%{
        opacity:1;
        transform:
            translateX(-50%)
            scale(1.2);
    }

    70%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translateX(-50%)
            scale(1);
    }
}

/* ================= COMBO ================= */

#combo{
    position:absolute;

    top:20%;
    left:50%;

    transform:translateX(-50%);

    z-index:350;

    opacity:0;

    text-align:center;
}

#comboNumber{
    font-size:65px;
    font-weight:900;
    color:#ffd43b;

    text-shadow:
        4px 4px #000,
        0 0 20px orange;
}

#comboText{
    font-weight:900;
    letter-spacing:4px;
}

.comboShow{
    animation:comboAnimation .7s ease;
}

@keyframes comboAnimation{

    0%{
        opacity:0;
        transform:
            translateX(-50%)
            scale(.4);
    }

    30%{
        opacity:1;
        transform:
            translateX(-50%)
            scale(1.2);
    }

    100%{
        opacity:0;
    }
}

/* ================= SCREEN SHAKE ================= */

.shake{
    animation:shake .2s ease;
}

@keyframes shake{

    0%,100%{
        transform:translate(0);
    }

    25%{
        transform:translate(7px,-4px);
    }

    50%{
        transform:translate(-7px,4px);
    }

    75%{
        transform:translate(4px,2px);
    }
}

/* ================= CONTROLS ================= */

#controls{
    position:absolute;

    left:50%;
    bottom:1.5%;

    transform:translateX(-50%);

    z-index:250;

    padding:8px 15px;

    background:rgba(0,0,0,.8);

    border:1px solid #555;

    border-radius:6px;

    font-size:11px;

    white-space:nowrap;
}

/* ================= MOBILE ================= */

#mobileControls{
    display:none;

    position:absolute;

    left:10px;
    right:10px;
    bottom:10px;

    z-index:500;

    justify-content:space-between;
}

.mobileGroup{
    display:flex;
    gap:6px;
}

.mobileButton{
    width:48px;
    height:48px;

    border-radius:50%;

    border:2px solid white;

    background:rgba(0,0,0,.75);

    color:white;

    font-weight:bold;

    font-size:15px;

    touch-action:none;
}

/* ================= OVERLAYS ================= */

.overlay{
    position:absolute;

    inset:0;

    z-index:1000;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            #2b3150,
            #090b14 70%,
            #020307
        );

    text-align:center;
}

#gameOver{
    display:none;
}

.overlayTitle{
    font-size:clamp(45px,8vw,90px);
    font-weight:900;

    text-shadow:
        5px 5px #000;
}

.overlayTitle span{
    color:#ff304f;
}

.subtitle{
    margin-top:12px;

    letter-spacing:4px;

    color:#c4c8d8;
}

.gameButton{
    margin-top:30px;

    padding:15px 45px;

    border:0;

    border-radius:5px;

    background:
        linear-gradient(
            #ff405c,
            #c71735
        );

    color:white;

    font-weight:900;

    font-size:16px;

    cursor:pointer;
}

/* ================= MOBILE RESPONSIVE ================= */

@media(max-width:700px){

    #title{
        font-size:22px;
    }

    .hud{
        top:42px;
        width:39%;
    }

    #roundInfo{
        top:72px;
    }

    #ring{
        left:2%;
        right:2%;
        bottom:14%;
        height:55%;
    }

    .fighter{
        width:125px;
        height:205px;
    }

    #controls{
        display:none;
    }

    #mobileControls{
        display:flex;
    }
}

</style>
</head>

<body>

<div id="game">

    <div class="light light1"></div>
    <div class="light light2"></div>
    <div class="light light3"></div>

    <div id="title">
        BOBBY <span>BOXING</span>
    </div>


    <!-- BOBBY HUD -->

    <div id="playerHud" class="hud">

        <div class="name">
            🥊 BOBBY
        </div>

        <div class="barOuter">
            <div id="playerHealth" class="health"></div>
        </div>

        <div class="barOuter">
            <div id="playerStamina" class="stamina"></div>
        </div>

    </div>


    <!-- VENOM HUD -->

    <div id="enemyHud" class="hud">

        <div class="name">
            VENOM 🖤
        </div>

        <div class="barOuter">
            <div id="enemyHealth" class="health"></div>
        </div>

        <div class="barOuter">
            <div id="enemyStamina" class="stamina"></div>
        </div>

    </div>


    <!-- TIMER -->

    <div id="roundInfo">

        <div id="roundLabel">
            ROUND 1
        </div>

        <div id="timer">
            60
        </div>

    </div>


    <div id="crowd">
        ● ● ● ● ● ● ● ● ● ● ● ● ● ●
    </div>


    <!-- BOXING RING -->

    <div id="ring">

        <div class="rope rope1"></div>
        <div class="rope rope2"></div>
        <div class="rope rope3"></div>

        <div class="post postLeft"></div>
        <div class="post postRight"></div>

        <div id="floor"></div>


        <!-- BOBBY -->

        <div id="bobby" class="fighter">

            <img
                src="assets/bobby.svg"
                class="character"
                alt="Bobby">

        </div>


        <!-- VENOM -->

        <div id="venom" class="fighter">

            <img
                src="assets/venom.svg"
                class="character"
                alt="Venom">

        </div>

    </div>


    <div id="effects"></div>


    <!-- COMBO -->

    <div id="combo">

        <div id="comboNumber">
            2
        </div>

        <div id="comboText">
            HIT COMBO
        </div>

    </div>


    <!-- MESSAGE -->

    <div id="message">
        FIGHT!
    </div>


    <!-- KEYBOARD CONTROLS -->

    <div id="controls">

        A / D MOVE
        &nbsp;•&nbsp;
        W JUMP
        &nbsp;•&nbsp;
        J JAB
        &nbsp;•&nbsp;
        K CROSS
        &nbsp;•&nbsp;
        L HEAVY
        &nbsp;•&nbsp;
        S BLOCK
        &nbsp;•&nbsp;
        SPACE DASH

    </div>


    <!-- MOBILE CONTROLS -->

    <div id="mobileControls">

        <div class="mobileGroup">

            <button class="mobileButton" data-action="left">
                ◀
            </button>

            <button class="mobileButton" data-action="right">
                ▶
            </button>

            <button class="mobileButton" data-action="jump">
                ⬆
            </button>

        </div>


        <div class="mobileGroup">

            <button class="mobileButton" data-action="jab">
                J
            </button>

            <button class="mobileButton" data-action="cross">
                K
            </button>

            <button class="mobileButton" data-action="heavy">
                L
            </button>

            <button class="mobileButton" data-action="block">
                🛡
            </button>

        </div>

    </div>


    <!-- START -->

    <div id="startScreen" class="overlay">

        <div class="overlayTitle">
            BOBBY <span>BOXING</span>
        </div>

        <div class="subtitle">
            V6 • FIGHT NIGHT
        </div>

        <button id="startButton" class="gameButton">
            ENTER THE RING
        </button>

    </div>


    <!-- GAME OVER -->

    <div id="gameOver" class="overlay">

        <div id="result" class="overlayTitle">
            BOBBY <span>WINS!</span>
        </div>

        <div id="resultText" class="subtitle">
            KNOCKOUT!
        </div>

        <button id="rematch" class="gameButton">
            REMATCH
        </button>

    </div>

</div>


<script>

/* ================= ELEMENTS ================= */

const game = document.getElementById("game");

const bobby = document.getElementById("bobby");
const venom = document.getElementById("venom");

const playerHealthBar =
    document.getElementById("playerHealth");

const enemyHealthBar =
    document.getElementById("enemyHealth");

const playerStaminaBar =
    document.getElementById("playerStamina");

const enemyStaminaBar =
    document.getElementById("enemyStamina");

const timerElement =
    document.getElementById("timer");

const message =
    document.getElementById("message");

const combo =
    document.getElementById("combo");

const comboNumber =
    document.getElementById("comboNumber");

const effects =
    document.getElementById("effects");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const gameOver =
    document.getElementById("gameOver");

const result =
    document.getElementById("result");

const resultText =
    document.getElementById("resultText");

const rematch =
    document.getElementById("rematch");


/* ================= GAME STATE ================= */

let running = false;

let playerHP = 100;
let enemyHP = 100;

let playerStamina = 100;
let enemyStamina = 100;

let playerX = 19;
let enemyX = 69;

let timeLeft = 60;

let playerAttacking = false;
let playerBlocking = false;
let playerJumping = false;

let enemyAttacking = false;

let comboCount = 0;

let timerInterval;
let enemyInterval;
let comboTimer;

let audioContext;


/* ================= START ================= */

startButton.addEventListener("click",startGame);

rematch.addEventListener("click",restartGame);


function startGame(){

    running = true;

    startScreen.style.display = "none";

    try{

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }catch(error){}

    showMessage("FIGHT!");

    updateHUD();

    startTimer();

    startEnemyAI();
}


/* ================= RESTART ================= */

function restartGame(){

    location.reload();
}


/* ================= KEYBOARD ================= */

document.addEventListener("keydown",function(event){

    if(!running) return;

    const key = event.key.toLowerCase();

    if(event.repeat && !["a","d"].includes(key))
        return;

    if(key === "a")
        movePlayer(-2.8);

    if(key === "d")
        movePlayer(2.8);

    if(key === "w")
        jump();

    if(key === "j")
        playerAttack("jab");

    if(key === "k")
        playerAttack("cross");

    if(key === "l")
        playerAttack("heavy");

    if(key === "s")
        startBlock();

    if(event.code === "Space"){

        event.preventDefault();

        dash();
    }
});


document.addEventListener("keyup",function(event){

    if(event.key.toLowerCase() === "s")
        stopBlock();
});


/* ================= MOVEMENT ================= */

function movePlayer(amount){

    if(
        !running ||
        playerAttacking ||
        playerBlocking
    )
        return;

    playerX += amount;

    playerX =
        Math.max(
            7,
            Math.min(82,playerX)
        );

    bobby.style.left =
        playerX + "%";
}


/* ================= DASH ================= */

function dash(){

    if(
        !running ||
        playerAttacking ||
        playerBlocking ||
        playerStamina < 15
    )
        return;

    playerStamina -= 15;

    if(playerX < enemyX)
        playerX += 8;
    else
        playerX -= 8;

    playerX =
        Math.max(
            7,
            Math.min(82,playerX)
        );

    bobby.style.left =
        playerX + "%";

    updateHUD();

    playSound(350,.08,"sine");
}


/* ================= JUMP ================= */

function jump(){

    if(
        playerJumping ||
        playerAttacking ||
        playerBlocking
    )
        return;

    playerJumping = true;

    bobby.classList.add("jump");

    setTimeout(function(){

        bobby.classList.remove("jump");

        playerJumping = false;

    },500);
}


/* ================= BLOCK ================= */

function startBlock(){

    if(playerAttacking)
        return;

    playerBlocking = true;

    bobby.classList.add("block");
}


function stopBlock(){

    playerBlocking = false;

    bobby.classList.remove("block");
}


/* ================= PLAYER ATTACK ================= */

function playerAttack(type){

    if(
        !running ||
        playerAttacking ||
        playerBlocking
    )
        return;


    let damage;
    let cost;
    let duration;


    if(type === "jab"){

        damage = 7;
        cost = 4;
        duration = 220;

    }

    if(type === "cross"){

        damage = 11;
        cost = 7;
        duration = 280;

    }

    if(type === "heavy"){

        damage = 19;
        cost = 15;
        duration = 380;

    }


    if(playerStamina < cost){

        showMessage("TIRED!");

        return;
    }


    playerStamina -= cost;

    playerAttacking = true;

    bobby.classList.add(type);

    updateHUD();

    playSound(
        type === "heavy" ? 75 : 140,
        .08,
        "square"
    );


    const distance =
        Math.abs(playerX - enemyX);


    setTimeout(function(){

        if(
            running &&
            distance < 24
        ){

            hitEnemy(damage,type);

        }else if(running){

            showMessage("MISS!");

        }

    },90);


    setTimeout(function(){

        bobby.classList.remove(type);

        playerAttacking = false;

    },duration);
}


/* ================= HIT ENEMY ================= */

function hitEnemy(damage,type){

    if(!running)
        return;


    /* VENOM CAN BLOCK */

    if(Math.random() < .16){

        showMessage("BLOCKED!");

        playSound(100,.08,"square");

        return;
    }


    enemyHP -= damage;

    enemyHP =
        Math.max(0,enemyHP);


    venom.classList.add("hit");

    createImpact(
        venom,
        type === "heavy"
    );


    screenShake();


    comboCount++;

    showCombo();


    if(type === "heavy"){

        showMessage("💥 HEAVY HIT!");

        playSound(
            55,
            .14,
            "sawtooth"
        );

    }else{

        showMessage("HIT!");

        playSound(
            100,
            .1,
            "sawtooth"
        );
    }


    updateHUD();


    setTimeout(function(){

        venom.classList.remove("hit");

    },250);


    if(enemyHP <= 0){

        knockout("BOBBY");
    }
}


/* ================= COMBO ================= */

function showCombo(){

    comboNumber.textContent =
        comboCount;

    combo.classList.remove("comboShow");

    void combo.offsetWidth;

    combo.classList.add("comboShow");


    clearTimeout(comboTimer);


    comboTimer =
        setTimeout(function(){

            comboCount = 0;

        },1500);
}


/* ================= IMPACT ================= */

function createImpact(target,heavy){

    const spark =
        document.createElement("div");

    spark.className = "spark";

    spark.textContent =
        heavy ? "💥" : "✦";


    const targetRect =
        target.getBoundingClientRect();


    spark.style.left =
        (
            targetRect.left +
            targetRect.width / 2
        ) + "px";


    spark.style.top =
        (
            targetRect.top +
            targetRect.height * .35
        ) + "px";


    effects.appendChild(spark);


    setTimeout(function(){

        spark.remove();

    },420);
}


/* ================= ENEMY AI ================= */

function startEnemyAI(){

    enemyInterval =
        setInterval(function(){

            if(
                !running ||
                enemyAttacking
            )
                return;


            const distance =
                Math.abs(
                    enemyX -
                    playerX
                );


            if(distance > 20){

                if(enemyX > playerX)
                    enemyX -= 1.3;
                else
                    enemyX += 1.3;


                enemyX =
                    Math.max(
                        8,
                        Math.min(82,enemyX)
                    );


                venom.style.left =
                    enemyX + "%";

            }


            if(
                distance < 23 &&
                Math.random() < .45
            ){

                enemyAttack();
            }


            if(Math.random() < .08){

                if(enemyX > playerX)
                    enemyX += 3;
                else
                    enemyX -= 3;


                enemyX =
                    Math.max(
                        8,
                        Math.min(82,enemyX)
                    );


                venom.style.left =
                    enemyX + "%";
            }

        },430);
}


/* ================= ENEMY ATTACK ================= */

function enemyAttack(){

    if(
        !running ||
        enemyAttacking ||
        enemyStamina < 5
    )
        return;


    enemyAttacking = true;


    const random =
        Math.random();


    let type;
    let damage;
    let cost;
    let duration;


    if(random < .50){

        type = "jab";
        damage = 6;
        cost = 4;
        duration = 220;

    }else if(random < .85){

        type = "cross";
        damage = 10;
        cost = 7;
        duration = 280;

    }else{

        type = "heavy";
        damage = 16;
        cost = 14;
        duration = 380;
    }


    enemyStamina -= cost;

    enemyStamina =
        Math.max(0,enemyStamina);


    venom.classList.add(type);

    updateHUD();


    setTimeout(function(){

        const distance =
            Math.abs(
                enemyX -
                playerX
            );


        if(
            distance < 24 &&
            running
        ){

            hitPlayer(
                damage,
                type
            );
        }

    },100);


    setTimeout(function(){

        venom.classList.remove(type);

        enemyAttacking = false;

    },duration);
}


/* ================= HIT PLAYER ================= */

function hitPlayer(damage,type){

    if(playerJumping){

        showMessage("DODGED!");

        return;
    }


    if(playerBlocking){

        damage =
            Math.max(
                1,
                Math.floor(
                    damage * .2
                )
            );

        showMessage("BLOCKED!");

        playSound(
            90,
            .08,
            "square"
        );

    }else{

        bobby.classList.add("hit");

        createImpact(
            bobby,
            type === "heavy"
        );

        screenShake();

        showMessage(
            type === "heavy"
            ? "💥 VENOM SMASH!"
            : "VENOM HIT!"
        );

        playSound(
            70,
            .12,
            "sawtooth"
        );


        setTimeout(function(){

            bobby.classList.remove("hit");

        },250);
    }


    playerHP -= damage;

    playerHP =
        Math.max(
            0,
            playerHP
        );


    comboCount = 0;

    updateHUD();


    if(playerHP <= 0){

        knockout("VENOM");
    }
}


/* ================= STAMINA REGEN ================= */

setInterval(function(){

    if(!running)
        return;


    playerStamina =
        Math.min(
            100,
            playerStamina + 2
        );


    enemyStamina =
        Math.min(
            100,
            enemyStamina + 2.4
        );


    updateHUD();

},400);


/* ================= TIMER ================= */

function startTimer(){

    timerInterval =
        setInterval(function(){

            if(!running)
                return;


            timeLeft--;

            timerElement.textContent =
                timeLeft;


            if(timeLeft <= 10){

                timerElement
                    .classList
                    .add("danger");
            }


            if(timeLeft <= 0){

                clearInterval(
                    timerInterval
                );

                pointsDecision();
            }

        },1000);
}


/* ================= HUD ================= */

function updateHUD(){

    playerHealthBar.style.width =
        playerHP + "%";

    enemyHealthBar.style.width =
        enemyHP + "%";

    playerStaminaBar.style.width =
        playerStamina + "%";

    enemyStaminaBar.style.width =
        enemyStamina + "%";
}


/* ================= MESSAGE ================= */

function showMessage(text){

    message.textContent =
        text;

    message.classList.remove(
        "messageShow"
    );

    void message.offsetWidth;

    message.classList.add(
        "messageShow"
    );
}


/* ================= SHAKE ================= */

function screenShake(){

    game.classList.remove("shake");

    void game.offsetWidth;

    game.classList.add("shake");
}


/* ================= KNOCKOUT ================= */

function knockout(winner){

    running = false;

    clearInterval(enemyInterval);

    clearInterval(timerInterval);


    showMessage("K.O.!");


    if(winner === "BOBBY"){

        result.innerHTML =
            'BOBBY <span>WINS!</span>';

        resultText.textContent =
            "🥊 KNOCKOUT! 🥊";

    }else{

        result.innerHTML =
            'VENOM <span>WINS!</span>';

        resultText.textContent =
            "VENOM WINS BY KNOCKOUT";
    }


    setTimeout(function(){

        gameOver.style.display =
            "flex";

    },900);
}


/* ================= POINTS ================= */

function pointsDecision(){

    running = false;

    clearInterval(enemyInterval);


    if(playerHP > enemyHP){

        result.innerHTML =
            'BOBBY <span>WINS!</span>';

        resultText.textContent =
            "🏆 WIN BY POINTS";

    }

    else if(enemyHP > playerHP){

        result.innerHTML =
            'VENOM <span>WINS!</span>';

        resultText.textContent =
            "VENOM WINS BY POINTS";

    }

    else{

        result.innerHTML =
            '<span>DRAW!</span>';

        resultText.textContent =
            "🔥 WHAT A FIGHT!";
    }


    gameOver.style.display =
        "flex";
}


/* ================= SOUND ================= */

function playSound(frequency,duration,type){

    if(!audioContext)
        return;


    try{

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type = type;

        oscillator.frequency.value =
            frequency;


        gain.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .12,
            audioContext.currentTime + .01
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime + duration
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    }catch(error){}
}


/* ================= MOBILE CONTROLS ================= */

document
.querySelectorAll(".mobileButton")
.forEach(function(button){

    button.addEventListener(
        "pointerdown",
        function(event){

            event.preventDefault();

            const action =
                button.dataset.action;


            if(action === "left")
                movePlayer(-3);

            if(action === "right")
                movePlayer(3);

            if(action === "jump")
                jump();

            if(action === "jab")
                playerAttack("jab");

            if(action === "cross")
                playerAttack("cross");

            if(action === "heavy")
                playerAttack("heavy");

            if(action === "block")
                startBlock();
        }
    );


    button.addEventListener(
        "pointerup",
        function(){

            if(
                button.dataset.action ===
                "block"
            ){

                stopBlock();
            }
        }
    );

});


/* ================= INITIAL ================= */

bobby.style.left =
    playerX + "%";

venom.style.left =
    enemyX + "%";

updateHUD();

</script>

</body>
</html>
